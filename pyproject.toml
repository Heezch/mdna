[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdna"
version = "0.2.0"
description = "Software module for DNA structure generation and analysis"
readme = "README.md"
license-files = []
authors = [{ name = "Thor van Heesch", email = "t.vanheesch@uva.nl" }]
 
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["Molecular Dynamics", 
      "Structure Analysis", 
      "Structure Generation Tool",
      "Molecular Toolkit",]
 
dependencies = ["mdtraj","numpy","scipy","matplotlib","biopython","numba","tables","joblib"]
 
requires-python = ">=3.10"

% Use pip install -e .[docs] if you also want to install the dependencies for building the documentation
[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-glightbox",
    "mkdocs-material",  
]

[project.urls]
Homepage = "https://github.com/heezch/mdna"
 
[tool.setuptools]
packages = ["mdna"]
package-dir = {"" = "mdna"}
py-modules = ["__init__"] # dash, not underscore


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
exclude = [
    "examples/data/filament_dataset/**",
    "examples/data/filament_dataset*.zip",
    "examples/data/filament_dataset*.tar",
    "examples/data/filament_dataset*.tar.gz",
    "mdna/simulate/Evals/PyLk/pylk/*.so",
    "mdna/simulate/Evals/PyLk/pylk/*.pyd",
    "mdna/simulate/Evals/PyLk/pylk/*cpython-*.so",
    "mdna/simulate/Evals/PyLk/pylk/*_cython.c",
    "mdna/simulate/Evals/PyLk/pylk/*_cython.html",
    "mdna/simulate/Evals/PyLk/build/**",
]
