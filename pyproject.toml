[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdna"
version = "0.2.0"
description = "Software module for DNA structure generation and analysis"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Thor van Heesch", email = "t.vanheesch@uva.nl" }]
 
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["Molecular Dynamics", 
      "Structure Analysis", 
      "Structure Generation Tool",
      "Molecular Toolkit",]
 
dependencies = ["mdtraj","numpy","scipy","matplotlib","biopython","numba","tables","joblib"]
 
requires-python = ">=3.10"

# Use pip install -e .[docs] if you also want to install the dependencies for building the documentation
# In zsh, quote extras so brackets are not treated as a glob: python -m pip install -e '.[docs]'
[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-glightbox",
    "mkdocs-material",  
]

[project.urls]
Homepage = "https://github.com/heezch/mdna"
 
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mdna", "mdna.*"]
exclude = ["mdna.simulate.Evals.PyLk.build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
